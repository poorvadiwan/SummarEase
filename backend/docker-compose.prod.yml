version: '3.8'

services:
    django:
        build:
            context: .
            dockerfile: Dockerfile.prod
        command: gunicorn backend.wsgi:application --bind 0.0.0.0:8000
        volumes:
            - static_volume:/home/backend/web/staticfiles
        expose:
            - 8000
        env_file:
            - ./.env
        depends_on:
            - postgres
    postgres:
        image: postgres:12
        volumes:
            - postgres_data:/var/lib/postgresql/data/
        ports:
            - 5432:5432
        env_file:
            - ./.env
    nginx:
        build: ./nginx
        volumes:
            - static_volume:/home/backend/web/staticfiles
        ports:
            - 1337:80
        depends_on:
            - django

volumes:
    postgres_data:
    static_volume: